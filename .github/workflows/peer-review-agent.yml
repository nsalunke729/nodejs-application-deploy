name: Peer Review Agent

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  peer-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate automated peer review
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const before = context.payload.before;
            const after = context.payload.after;
            const MAX_RISK_FILES_DISPLAYED = 8;
            const MAX_TOP_FILES_DISPLAYED = 10;
            const HIGH_RISK_EXTENSIONS = ['.js', '.ts', '.tsx', '.jsx', '.sh'];

            if (!before || /^0+$/.test(before)) {
              core.info('Skipping review summary for initial push without a comparable base commit.');
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${before}...${after}`,
            });

            const files = comparison.data.files || [];
            const changedFiles = files.length;
            const additions = files.reduce((sum, file) => sum + (file.additions || 0), 0);
            const deletions = files.reduce((sum, file) => sum + (file.deletions || 0), 0);

            const riskCandidates = files
              .map((file) => file.filename)
              .filter((filename) => {
                const lowerFilename = filename.toLowerCase();
                return (
                  lowerFilename.includes('dockerfile') ||
                  HIGH_RISK_EXTENSIONS.some((ext) => lowerFilename.endsWith(ext))
                );
              });

            const topFiles = [...files]
              .sort((a, b) => ((b.additions || 0) + (b.deletions || 0)) - ((a.additions || 0) + (a.deletions || 0)))
              .slice(0, MAX_TOP_FILES_DISPLAYED)
              .map((file) => {
              const status = file.status || 'modified';
              return `- \`${file.filename}\` (${status}, +${file.additions || 0}/-${file.deletions || 0})`;
              });

            const displayedRiskCandidates = riskCandidates.slice(0, MAX_RISK_FILES_DISPLAYED);
            const remainingRiskCount = riskCandidates.length - displayedRiskCandidates.length;
            const riskMessage = riskCandidates.length
              ? `⚠️ Potentially high-impact files detected: ${displayedRiskCandidates.map((name) => `\`${name}\``).join(', ')}${remainingRiskCount > 0 ? ` (and ${remainingRiskCount} more)` : ''}`
              : '✅ No high-impact file extensions detected in this push.';

            const body = [
              '## 🤖 Automated Peer Review Agent',
              '',
              `A push was detected on branch \`${context.ref.replace('refs/heads/', '')}\`.`,
              '',
              `- Commits in push: **${comparison.data.commits?.length || 0}**`,
              `- Files changed: **${changedFiles}**`,
              `- Lines added: **${additions}**`,
              `- Lines deleted: **${deletions}**`,
              '',
              '### Files to review',
              ...(topFiles.length ? topFiles : ['- No file-level diff metadata available.']),
              '',
              riskMessage,
              '',
              'Please complete human peer review before release.',
            ].join('\n');

            await core.summary.addRaw(body).write();
